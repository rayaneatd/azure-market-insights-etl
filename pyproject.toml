[project]
name = "azure-market-insights-elt"
version = "0.1.0"
description = "Azure Market Insights ETL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adbc-driver-postgresql>=1.12.0",
    "azure-identity>=1.25.3",
    "azure-storage-file-datalake>=12.25.0",
    "flask>=3.1.3",
    "httpx>=0.28.1",
    "msgspec>=0.21.1",
    "patito>=0.8.6",
    "polars>=1.43.2",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "tenacity>=9.1.4",
    "types-requests>=2.33.0.20260712",
]

[tool.pyrefly]
search_path = ["."]
